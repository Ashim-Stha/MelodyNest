version: '3.9'

services:

  nest:
    build: .
    env_file: ".env"
    ports:
      - 3000:3000
    depends_on:
      - mydb
    volumes:
      - .:/user/src/app
      - /user/src/app/node_modules
    networks:
      - mynetwork
    
  mydb:
    image: postgres
    restart: always
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=admin
      - POSTGRES_DB=mydb
    ports:
      - 5432:5432
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - mynetwork

volumes:
  dbdata:

networks:
  mynetwork:
    driver: bridge